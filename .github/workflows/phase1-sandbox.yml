name: Phase 1 Sandbox

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint and type-check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
      - name: Validate and exercise isolated Docker stack
        run: ./scripts/verify-phase1.sh
